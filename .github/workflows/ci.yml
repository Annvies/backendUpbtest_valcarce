name: CI - Backend

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: node --check src/app.js

      - name: Basic smoke test (start then stop)
        run: |
          node src/app.js &
          PID=$!
          sleep 5
          kill $PID
        env:
          PORT: 3000
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_SSL: true
